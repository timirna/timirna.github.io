<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Cat Mascot – Rive Preview</title>
<style>
  :root { --bg:#eef1f5; --card:#ffffff; --ink:#1d2330; --muted:#6b7385; --accent:#3b6fd8; --line:#dde2ea; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; padding:20px 16px 28px; gap:14px; min-height:100%; }
  header { text-align:center; }
  h1 { font-size:20px; margin:0 0 4px; font-weight:650; }
  header p { margin:0; color:var(--muted); font-size:14px; }
  .stage { position:relative; width:min(100%, 520px); aspect-ratio: 3 / 4; max-height:72vh;
    background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden;
    box-shadow:0 6px 24px rgba(20,30,50,.06); touch-action:none; }
  canvas { width:100%; height:100%; display:block; }
  #status { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:14px; background:var(--card); }
  .controls { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  button { font:inherit; font-weight:600; padding:10px 18px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button:active { transform:translateY(1px); }
  .readout { color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
  <header>
    <h1>Cat Mascot — Interactive Preview</h1>
    <p>Move your mouse or finger anywhere on the page — the cat follows it.</p>
  </header>

  <div class="stage" id="stage">
    <canvas id="rive"></canvas>
    <div id="status">Loading…</div>
  </div>

  <div class="controls">
    <button data-trigger="Blink">Blink</button>
    <button data-trigger="LickNose">Lick Nose</button>
    <button data-trigger="Happy">Happy</button>
    <button id="center">Center</button>
  </div>
  <div class="readout" id="readout">Look_X 0.00 · Look_Y 0.00</div>

<script src="https://unpkg.com/@rive-app/canvas@2"></script>
<script>
(function () {
  const canvas = document.getElementById('rive');
  const statusEl = document.getElementById('status');
  const readout = document.getElementById('readout');
  const SM = 'Cat_SM';
  let inputs = {}, vm = null;

  const r = new rive.Rive({
    src: 'cat.riv',
    canvas,
    stateMachines: SM,
    autoplay: true,
    autoBind: true,
    layout: new rive.Layout({ fit: rive.Fit.Contain, alignment: rive.Alignment.Center }),
    onLoad: () => {
      r.resizeDrawingSurfaceToCanvas();
      try { (r.stateMachineInputs(SM) || []).forEach(i => inputs[i.name] = i); } catch (e) {}
      try { vm = r.viewModelInstance || null; } catch (e) {}
      statusEl.remove();
    },
    onLoadError: () => { statusEl.textContent = 'Could not load the animation.'; }
  });
  window.addEventListener('resize', () => r.resizeDrawingSurfaceToCanvas());

  function setNum(name, v) {
    if (inputs[name]) inputs[name].value = v;
    if (vm) { try { const p = vm.number(name); if (p) p.value = v; } catch (e) {} }
  }
  function fire(name) {
    if (inputs[name]) { inputs[name].fire ? inputs[name].fire() : (inputs[name].value = true); }
    if (vm) { try { const p = vm.trigger(name); if (p) p.trigger(); } catch (e) {} }
  }

  // Gaze: pointer position relative to the stage centre → -1..1, smoothed.
  const stage = document.getElementById('stage');
  let tx = 0, ty = 0, x = 0, y = 0;
  const clamp = v => Math.max(-1, Math.min(1, v));
  function aim(cx, cy) {
    const b = stage.getBoundingClientRect();
    const mx = b.left + b.width / 2, my = b.top + b.height / 2;
    const rx = Math.max(b.width * 0.6, window.innerWidth / 2 - 0);
    const ry = Math.max(b.height * 0.5, window.innerHeight / 2 - 0);
    tx = clamp((cx - mx) / rx);
    ty = clamp((cy - my) / ry);   // -1 = up, +1 = down
  }
  window.addEventListener('pointermove', e => aim(e.clientX, e.clientY), { passive: true });
  window.addEventListener('pointerdown', e => aim(e.clientX, e.clientY), { passive: true });
  document.getElementById('center').addEventListener('click', () => { tx = 0; ty = 0; });

  (function tick() {
    x += (tx - x) * 0.15; y += (ty - y) * 0.15;
    if (Math.abs(tx - x) < 0.001) x = tx;
    if (Math.abs(ty - y) < 0.001) y = ty;
    setNum('Look_X', x); setNum('Look_Y', y);
    readout.textContent = 'Look_X ' + x.toFixed(2) + ' · Look_Y ' + y.toFixed(2);
    requestAnimationFrame(tick);
  })();

  document.querySelectorAll('[data-trigger]').forEach(b =>
    b.addEventListener('click', e => { e.stopPropagation(); fire(b.dataset.trigger); }));
})();
</script>
</body>
</html>
