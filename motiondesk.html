const hrs = (sec) => {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
};
const clock = (sec) => {
  const h = String(Math.floor(sec / 3600)).padStart(2, "0");
  const m = String(Math.floor((sec % 3600) / 60)).padStart(2, "0");
  const s = String(Math.floor(sec % 60)).padStart(2, "0");
  return `${h}:${m}:${s}`;
};

const SB_URL = "https://bnbtokbcvwtzixyzmaij.supabase.co";

const ROW_ID = "main";

const sbHeaders = { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "Content-Type": "application/json" };
const cloudLoad = async () => {
  const res = await fetch(`${SB_URL}/rest/v1/kv?id=eq.${ROW_ID}&select=data`, { headers: sbHeaders });
  if (!res.ok) throw new Error("load failed");
  const rows = await res.json();
  return rows[0] ? rows[0].data : null;
};
const cloudSave = async (data) => {
  const res = await fetch(`${SB_URL}/rest/v1/kv`, {
    method: "POST",
    headers: { ...sbHeaders, Prefer: "resolution=merge-duplicates,return=minimal" },
    body: JSON.stringify([{ id: ROW_ID, data, updated_at: new Date().toISOString() }]),
  });
  if (!res.ok) throw new Error("save failed");
};

  const [pin, setPin] = useState("");
  const [err, setErr] = useState(false);
  const submit = () => {
    if (pin === PASSCODE) { try { localStorage.setItem("motiondesk-unlocked", "1"); } catch {} onUnlock(); }
    else { setErr(true); setPin(""); }
  };
  return (
    <div className="min-h-screen flex items-center justify-center p-6" style={{ background: "radial-gradient(1200px 600px at 80% -10%, rgba(167,139,250,0.10), transparent), #0b0e16", color: "#e6e8f0", fontFamily: "'Inter', system-ui, sans-serif" }}>
      <div style={{ width: "100%", maxWidth: 320, textAlign: "center" }}>

        <p style={{ color: "#8b93a7", fontSize: 14, marginBottom: 20 }}>Enter your passcode</p>
        <input type="password" value={pin} autoFocus
          onChange={(e) => { setPin(e.target.value); setErr(false); }}
          onKeyDown={(e) => e.key === "Enter" && submit()}
          style={{ ...inputStyle, textAlign: "center", letterSpacing: 4, marginBottom: 12, borderColor: err ? "#f87171" : "rgba(255,255,255,0.1)" }} />
        {err && <div style={{ color: "#f87171", fontSize: 13, marginBottom: 12 }}>Wrong passcode</div>}
        <button onClick={submit} className="w-full" style={{ background: "#a78bfa", color: "#0c0e16", fontWeight: 600, padding: "10px", borderRadius: 10, border: "none", cursor: "pointer" }}>Unlock</button>
      </div>
    </div>
  );
}

/* ---------- main app ---------- */
function MotionDesk() {
  const [unlocked, setUnlocked] = useState(() => { try { return localStorage.getItem("motiondesk-unlocked") === "1"; } catch { return false; } });
  const [data, setData] = useState(null);
  const [tab, setTab] = useState("dashboard");
  const [modal, setModal] = useState(null);
  const [tick, setTick] = useState(0);
  const [saveState, setSaveState] = useState("idle");
  const saveTimer = useRef(null);
  const firstSave = useRef(true);

  useEffect(() => {
    (async () => {
      let local = null;
      try { const raw = localStorage.getItem(STORE_KEY); if (raw) local = JSON.parse(raw); } catch {}
      try {
        const cloud = await cloudLoad();
        if (cloud) { setData({ ...SEED, ...cloud }); localStorage.setItem(STORE_KEY, JSON.stringify(cloud)); return; }
      } catch {}
      setData(local ? { ...SEED, ...local } : SEED);
    })();
  }, []);

  useEffect(() => {
    if (!data) return;
    if (firstSave.current) { firstSave.current = false; return; }
    setSaveState("saving");
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch {}
      try {
        await cloudSave(data);
        setSaveState("saved");
        setTimeout(() => setSaveState("idle"), 1500);
      } catch {
        setSaveState("error");
      }
    }, 600);
  }, [data]);

  const timerRunning = !!(data && data.timer);
  useEffect(() => {
    if (!timerRunning) return;
    const t = setInterval(() => setTick((x) => x + 1), 1000);
    return () => clearInterval(t);
  }, [timerRunning]);

  useEffect(() => {
    const handler = (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;
      const order = ["dashboard", "work", "expenses", "income", "projects", "clients", "ideas", "goals", "analytics"];
      if (e.key >= "1" && e.key <= "9") setTab(order[+e.key - 1]);
      if (e.key.toLowerCase() === "n") {
        const map = { work: "task", expenses: "expense", income: "income", projects: "project", clients: "client", ideas: "idea" };
        if (map[tab]) setModal({ type: map[tab] });
      }
    };
    window.addEventListener("keydown", handler);

  const Ideas = () => (
    <Section title="Ideas board" onAdd={() => setModal({ type: "idea" })} addLabel="New idea (N)">
      {data.ideas.length === 0 && <Empty text="Blank canvas. Capture the next gig idea." />}
      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
        {data.ideas.map((i) => (
          <Card key={i.id} className="p-4 flex flex-col">
            {i.tag && <span className="text-xs mb-2 self-start px-2 py-0.5 rounded-full" style={{ background: "rgba(167,139,250,0.15)", color: "#a78bfa" }}>{i.tag}</span>}
            <p className="text-sm flex-1">{i.text}</p>
            <div className="flex gap-1 mt-3">
              <Btn onClick={() => setModal({ type: "idea", item: i })}>✎</Btn>
              <Btn variant="danger" onClick={() => del("ideas", i.id)}>✕</Btn>
            </div>
          </Card>
        ))}
      </div>
    </Section>
  );

  const Goals = () => (
    <Section title="Daily goals" onAdd={() => setModal({ type: "goal" })} addLabel="Edit list">
      <Card className="p-4 max-w-lg">
        <div className="flex justify-between items-center mb-3">
          <span className="text-sm" style={{ color: "#8b93a7" }}>{goalsToday.length} of {data.goalsList.length} done today</span>
          <span className="font-semibold" style={{ color: "#a78bfa" }}>{goalPct}%</span>
        </div>
        <div className="h-2 rounded-full mb-4" style={{ background: "rgba(255,255,255,0.07)" }}>
          <div className="h-full rounded-full transition-all" style={{ width: `${goalPct}%`, background: "linear-gradient(90deg,#a78bfa,#5eead4)" }} />
        </div>
        {data.goalsList.map((g, i) => (
          <button key={i} onClick={() => toggleGoal(i)} className="flex items-center gap-3 py-2.5 w-full text-left border-b last:border-0" style={{ borderColor: "rgba(255,255,255,0.05)" }}>
            <span style={{
              width: 18, height: 18, borderRadius: 6, flexShrink: 0, display: "inline-flex", alignItems: "center", justifyContent: "center",
              border: goalsToday.includes(i) ? "none" : "1.5px solid #8b93a7",
              background: goalsToday.includes(i) ? "#a78bfa" : "transparent", color: "#0c0e16", fontSize: 12, fontWeight: 700,
            }}>{goalsToday.includes(i) ? "✓" : ""}</span>
            <span style={{ opacity: goalsToday.includes(i) ? 0.5 : 1, textDecoration: goalsToday.includes(i) ? "line-through" : "none" }}>{g}</span>
          </button>
        ))}
        <p className="text-xs mt-3" style={{ color: "#8b93a7" }}>Resets every day automatically.</p>
      </Card>
    </Section>
  );

  const Analytics = () => (
    <Section title="Analytics">
      <div className="grid grid-cols-2 lg:grid-cols-3 gap-3 mb-4">
        <StatCard label="Hours this week" value={`${weekHours}h`} accent="#a78bfa" />
        <StatCard label="Income this month" value={usd(monthIncome)} accent="#5eead4" />
        <StatCard label="Expenses this month" value={bdt(monthExpenses)} accent="#f5b544" />
        <StatCard label="Productivity score" value={`${productivity}`} sub="goals + tasks + hours" accent={productivity >= 70 ? "#5eead4" : productivity >= 40 ? "#f5b544" : "#f87171"} />
        <StatCard label="Tasks completed" value={`${doneTasks.length}/${data.tasks.length}`} />
        <StatCard label="Avg hourly rate" value={doneHours > 0 ? `৳${avgRate}/h` : "—"} sub={doneHours > 0 ? `${doneHours.toFixed(1)}h billed` : "complete tasks with tracked time"} />
      </div>
      <Card className="p-4">
        <h3 className="font-semibold mb-2">Work rhythm — last 7 days</h3>
        <ResponsiveContainer width="100%" height={200}>
          <AreaChart data={last7}>
            <defs>
              <linearGradient id="hoursGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#a78bfa" stopOpacity={0.5} />
                <stop offset="100%" stopColor="#a78bfa" stopOpacity={0} />
              </linearGradient>
            </defs>
            <CartesianGrid stroke="rgba(255,255,255,0.05)" vertical={false} />
            <XAxis dataKey="day" stroke="#8b93a7" fontSize={11} tickLine={false} axisLine={false} />
            <YAxis stroke="#8b93a7" fontSize={11} tickLine={false} axisLine={false} width={28} />
            <Tooltip contentStyle={{ background: "#141826", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 10, fontSize: 12 }} />
            <Area type="monotone" dataKey="hours" stroke="#a78bfa" strokeWidth={2} fill="url(#hoursGrad)" isAnimationActive={false} />
          </AreaChart>
        </ResponsiveContainer>
      </Card>
    </Section>
  );

  const views = { dashboard: Dashboard, work: Work, expenses: Expenses, income: Income, projects: Projects, clients: Clients, ideas: Ideas, goals: Goals, analytics: Analytics };
  const View = views[tab];

  return (
    <div className="min-h-screen" style={{
      background: "radial-gradient(1200px 600px at 80% -10%, rgba(167,139,250,0.10), transparent), radial-gradient(900px 500px at -10% 100%, rgba(94,234,212,0.06), transparent), #0b0e16",
      color: "#e6e8f0", fontFamily: "'Inter', system-ui, sans-serif",
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap');
        @keyframes wave { 0%,100% { transform: rotate(0deg);} 25% { transform: rotate(16deg);} 75% { transform: rotate(-8deg);} }
        @keyframes pulse { 0%,100% { opacity: 1;} 50% { opacity: 0.3;} }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }
        input:focus, textarea:focus, select:focus { border-color: #a78bfa !important; }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
      `}</style>
      <div className="flex">
        <nav className="hidden lg:flex flex-col w-52 min-h-screen p-4 sticky top-0 self-start" style={{ borderRight: "1px solid rgba(255,255,255,0.06)" }}>
          <div className="flex items-center gap-2 mb-8 px-2">
            <span style={{ width: 12, height: 12, transform: "rotate(45deg)", background: "linear-gradient(135deg,#a78bfa,#5eead4)", borderRadius: 3, display: "inline-block" }} />
            <span className="font-bold text-lg" style={{ fontFamily: "'Space Grotesk', system-ui" }}>MotionDesk</span>
          </div>
          {tabs.map(([id, icon, label], i) => (
            <button key={id} onClick={() => setTab(id)}
              className="flex items-center gap-3 px-3 py-2 rounded-xl text-sm mb-1 text-left transition-colors"
              style={{ background: tab === id ? "rgba(167,139,250,0.14)" : "transparent", color: tab === id ? "#c9b8fd" : "#8b93a7" }}>
              <span className="w-4 text-center">{icon}</span>{label}
              <span className="ml-auto text-xs opacity-40">{i + 1}</span>
            </button>
          ))}
          <div className="mt-auto px-3 text-xs" style={{ color: "#5a6175" }}>
            {saveState === "saving" ? "Saving…" : saveState === "saved" ? "✓ Saved" : saveState === "error" ? "⚠ Save failed" : ""}
            <div className="mt-1">Keys: 1–9 tabs · N new</div>
          </div>
        </nav>
        <div className="lg:hidden fixed top-0 left-0 right-0 z-40" style={{ background: "rgba(11,14,22,0.85)", backdropFilter: "blur(14px)", borderBottom: "1px solid rgba(255,255,255,0.06)" }}>
          <div className="flex items-center gap-2 px-4 pt-3 pb-2">
            <span style={{ width: 10, height: 10, transform: "rotate(45deg)", background: "linear-gradient(135deg,#a78bfa,#5eead4)", borderRadius: 2, display: "inline-block" }} />
            <span className="font-bold" style={{ fontFamily: "'Space Grotesk', system-ui" }}>MotionDesk</span>
            <span className="ml-auto text-xs" style={{ color: "#5a6175" }}>{saveState === "saving" ? "Saving…" : saveState === "saved" ? "✓" : ""}</span>
          </div>
          <div className="flex gap-1 overflow-x-auto px-3 pb-2" style={{ scrollbarWidth: "none" }}>
            {tabs.map(([id, icon, label]) => (
              <button key={id} onClick={() => setTab(id)} className="flex-shrink-0 px-3 py-1.5 rounded-full text-xs"
                style={{ background: tab === id ? "rgba(167,139,250,0.18)" : "rgba(255,255,255,0.05)", color: tab === id ? "#c9b8fd" : "#8b93a7" }}>
                {icon} {label}
              </button>
            ))}
          </div>
        </div>
        <main className="flex-1 p-4 sm:p-6 lg:p-8 pt-24 lg:pt-8 max-w-5xl mx-auto w-full">
          {View()}
        </main>
      </div>
      {modal && (modal.type === "goal"
        ? <GoalsModal data={data} upd={upd} setModal={setModal} />
        : <EditModal key={modal.type + (modal.item ? modal.item.id : "new")} modal={modal} setModal={setModal} upd={upd} today={today} />)}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<MotionDesk />);
</script>
</body>
</html>
